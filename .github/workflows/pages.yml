name: Build, test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create-release:
        description: Also publish the built site as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYODIDE_VERSION: 314.0.7
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-app
        with:
          pyodide-version: ${{ env.PYODIDE_VERSION }}

      - name: Build
        run: |
          npm run build -- --base "$BASE_PATH"
          touch dist/.nojekyll

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/dist
          include-hidden-files: true
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-app
        with:
          pyodide-version: ${{ env.PYODIDE_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Type check
        run: npm run typecheck

      - name: Core Python tests (desktop CPython)
        working-directory: .
        env:
          # The app's OpenGL shim stands in for PyOpenGL without a display.
          PYTHONPATH: app/python
        run: |
          python -m pip install --quiet pygame-ce numpy pillow
          python app/python/tests/test_core.py

      - name: Browser tests
        run: npm test

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: app/dist

      - name: Test the build under its Pages base path
        env:
          FOF_BASE_URL: http://localhost:4173${{ env.BASE_PATH }}
        run: |
          npx vite preview --base "$BASE_PATH" --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -fsS "$FOF_BASE_URL" > /dev/null && break; sleep 1; done
          npx playwright test tests/01-boot.spec.ts tests/10-index.spec.ts

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  deploy:
    needs: [build, test]
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: build-${{ github.run_number }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Zip build
        run: cd dist && zip -qr "../fretsonfire-$TAG.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "fretsonfire-$TAG.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Frets on Fire web build $TAG" \
            --notes "Static site built from $GITHUB_SHA for the base path $BASE_PATH." \
            --generate-notes
