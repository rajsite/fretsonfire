<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frets on Fire</title>
    <link rel="icon" href="game/data/icon.png" />
    <link rel="stylesheet" href="./src/game.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #container {
        width: 100vw;
        height: 100vh;
        /* Mobile browsers count their toolbars in vh. */
        height: 100dvh;
      }
      .fof-links {
        position: fixed;
        z-index: 3;
        top: 6px;
        right: 8px;
        font: 12px system-ui, sans-serif;
        color: #777;
      }
      .fof-links a {
        color: #aaa;
      }
      .fof-links button {
        font: inherit;
        color: #ddd;
        background: #333;
        border: 1px solid #666;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .fof-links button[aria-pressed='true'] {
        background: #555;
        border-color: #aaa;
      }
      @media (pointer: coarse) {
        .fof-keys {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="container" class="fof-container">
      <canvas id="game" width="640" height="480" tabindex="0"></canvas>
      <div id="overlay" class="fof-overlay" hidden></div>
    </div>
    <div class="fof-links">
      <span class="fof-keys">Frets F1&ndash;F5, pick Enter &middot;</span> <button id="fof-fullscreen" type="button">Fullscreen</button> <span class="fof-keys">(Alt+Enter)</span> &middot; <button id="fof-touch-toggle" type="button" aria-pressed="false">Touch frets</button> &middot; <a href="pages/index.html">dev pages</a>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
